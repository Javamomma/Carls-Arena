<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Carl's Doorway Brawl</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#090b12;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;background:#101422}

.panel{text-align:center;padding:16px;max-width:520px}.panel h1{margin:0 0 8px;font-size:28px;letter-spacing:2px}.panel p{font-size:13px;line-height:1.5}.panel button{display:block;width:100%;margin:8px 0;padding:12px;font:inherit;font-size:16px;background:#f4c542;color:#111;border:0;border-radius:6px}

.cbtn::after{content:attr(data-label);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:10px;letter-spacing:1px;color:#f4c542;white-space:nowrap}
.cbtn.ready{background:#f4c542;color:#111;box-shadow:0 0 16px 4px rgba(244,197,66,.65)}

</style></head><body><div id="wrap"><canvas id="game" width="854" height="480"></canvas>
<div id="btns">
<button id="btnBlock" class="cbtn" data-label="BLOCK"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5 19.5 5.5V11C19.5 16 16 20 12 21.5 8 20 4.5 16 4.5 11V5.5Z"/></svg></button>
<button id="btnPunch" class="cbtn" data-label="PUNCH"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><rect x="7" y="9" width="12" height="10" rx="3"/><circle cx="9.5" cy="7" r="2.3"/><circle cx="13" cy="6" r="2.3"/><circle cx="16.5" cy="7" r="2.3"/><rect x="4" y="11" width="5" height="6" rx="2.4"/></svg></button>

<button id="btnPower" class="cbtn" data-label="POWER"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M13 1 3 14h6.5L8.5 23 21 9h-7z"/></svg></button>

</div>

<div class="overlay show" id="title"><div class="panel"><h1>CARL'S DOORWAY BRAWL</h1><p>ONE THUMB. ONE DOORWAY. ONE CRAWLER LEAVES.<br>LEFT SIDE: HOLD = BLOCK, SWIPE LEFT = DODGE. RIGHT SIDE: TAP = LIGHT, SWIPE RIGHT = MEDIUM, HOLD = HEAVY.</p><button id="fightBtn">FIGHT</button><button id="titleMute">SOUND: ON</button></div></div>
<div class="overlay" id="pauseMenu"><div class="panel"><h1>PAUSED</h1><button id="resume">RESUME</button><button id="quit">QUIT</button></div></div>

</div><script>

'use strict';
const W=854,H=480,FLOOR=400,STEP=1/60;
const canvas=document.getElementById('game');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
// xorshift32; deterministic per seed. Never use Math.random inside the sim.
function RNG(seed){let s=(seed>>>0)||0x9e3779b9;return{
  next(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296},
  int(n){return Math.floor(this.next()*n)},
  pick(a){return a[this.int(a.length)]}}}

const Save={key:'carlsArena.v1',data:null,
  load(){try{this.data=JSON.parse(localStorage.getItem(this.key))||null}catch(e){this.data=null}
    if(!this.data)this.data={v:1,gold:0,units:0,roster:{},mute:false,settings:{}}},
  put(){try{localStorage.setItem(this.key,JSON.stringify(this.data))}catch(e){}}};
Save.load();

const Audio={ac:null,muted:Save.data.mute,_t:0,
  init(){if(!this.ac){try{this.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume()},
  tone(f,d=.08,type='square',v=.035,when=0){if(this.muted||!this.ac)return;const t=this.ac.currentTime+when,o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(this.ac.destination);o.start(t);o.stop(t+d+.02)},
  say(line){const el=document.getElementById('toast');el.textContent=line;clearTimeout(this._t);this._t=setTimeout(()=>{el.textContent=''},2200)},
  // Per-move sound recipes: short sequences of Audio.tone calls. Every entry is a plain function
  // that only calls this.tone (which itself no-ops when muted or before an AudioContext exists via
  // user gesture), so every recipe is safe to call from the headless test harness with no gesture.
  recipes:{
    lights(){Audio.tone(210,.05,'square',.045)},                                   // generic short thud (fallback)
    light1(){Audio.tone(200,.05,'square',.045)},
    light2(){Audio.tone(215,.05,'square',.045)},
    light3(){Audio.tone(230,.05,'square',.045)},
    light4(){Audio.tone(245,.05,'square',.048)},
    light5(){Audio.tone(260,.06,'square',.05);Audio.tone(120,.08,'sawtooth',.04,.02)}, // chain-ender: thud + low tail
    medium(){Audio.tone(620,.06,'sine',.02);Audio.tone(160,.1,'sawtooth',.05,.06)},     // whoosh then thud
    heavy(){Audio.tone(70,.08,'sawtooth',.03);Audio.tone(100,.08,'sawtooth',.03,.08);Audio.tone(140,.08,'sawtooth',.035,.16); // wind-up (rising)
      Audio.tone(65,.2,'square',.09,.26)},                                              // ...then crunch
    s1(){for(let i=0;i<3;i++)Audio.tone(280-i*25,.05,'square',.05,i*.07)},               // rapid hits
    s2(){for(let i=0;i<5;i++)Audio.tone(320-i*18,.05,'square',.05,i*.05)},               // rapid hits
    s3(){for(let i=0;i<5;i++)Audio.tone(140+i*55,.06,'sawtooth',.03,i*.05);              // rising sweep
      Audio.tone(50,.35,'square',.09,.34);Audio.tone(40,.3,'sawtooth',.08,.36)},         // ...then boom
    block(){Audio.tone(420,.04,'triangle',.03)},                                        // clack
    parry(){Audio.tone(880,.08,'square',.05);Audio.tone(1320,.12,'square',.04,.06)},     // chime
    dash(){Audio.tone(520,.1,'sine',.02);Audio.tone(300,.08,'sine',.015,.05)},           // whoosh
    ko(){for(let i=0;i<6;i++)Audio.tone(300-40*i,.15,'sawtooth',.05,i*.07)}},            // descending
  // rng.pick is deterministic given a seeded RNG (see 10_util.js), so the same fight rng state
  // always reads the same line for the same kind.
  pickLine(kind,rng){const arr=Lines[kind];return arr&&arr.length?rng.pick(arr):''},
  // Routes through G.say (defined in 80_game.js), which throttles how often the toast updates so a
  // burst of events (e.g. a streak landing right before a KO) doesn't overwrite itself mid-read.
  announce(kind,rng){G.say(this.pickLine(kind,rng))}};
// Snarky dungeon-game-show-host lines, Dungeon Crawler Carl flavored (Carl, Donut, the dungeon,
// sponsors, viewers). No profanity. Picked deterministically via Audio.pickLine(kind, fight.rng).
const Lines={
  start:[

  streak3:[
    "Three in a row! Someone's been practicing between commercials.",
    "A three-hit combo! The sponsors are thrilled. The other fighter is not.",
    "Three! The crowd is starting to believe in something.",

    "Three consecutive! The dungeon's insurance premiums just went up."],
  streak5:[
    "Five hits! This is starting to look less like a fight and more like a lesson.",
    "Five in a row! Someone forgot to bring their own combo.",
    "A five-hit streak! Carl's fan club just doubled in size.",
    "Five straight! The sponsors are printing extra merchandise as we speak.",
    "Five! The dungeon walls are practically applauding.",
    "That's a five-piece! Someone owes the vending machine an apology.",

  streak10:[
    "TEN HITS! Somebody call the record books, or at least the janitor.",
    "A perfect ten! The sponsors have officially run out of confetti.",
    "Ten in a row! This is no longer a fight, it's a demonstration.",
    "TEN! Donut has stopped pretending not to care.",
    "Ten consecutive hits! The dungeon itself seems nervous.",

  parry:[

  special:[
    "SPECIAL MOVE INCOMING! Sponsors, please look away from the screen.",
    "Now THAT'S a power move! The dungeon's lighting budget just spiked.",
    "A special attack! Someone's been saving up their allowance.",
    "Big flashy move! The viewers demand a slow-motion replay, and they shall have one.",
    "Power unleashed! Donut is filming this for the highlight reel.",
    "SPECIAL! The sponsors are already drafting the merchandise.",
    "That's the good stuff! The dungeon lights dim in respect.",
    "A special move, executed with the subtlety of a falling piano.",
    "Power move! Somewhere, a producer just yelled 'get the good camera'."],
  win:[
    "VICTORY! The crowd erupts, mostly out of relief.",
    "And there it is! Our winner stands, somehow still standing.",
    "That's the fight! Sponsors, roll the confetti, we earned it.",
    "WINNER! Donut gives a single, dignified clap.",
    "Victory secured! Somebody get this contestant a towel and a contract.",
    "The doorway has chosen its champion. The dungeon approves.",
    "That's a win for the ages, or at least for tonight's ratings.",
    "Our champion stands tall! The sponsors are already planning a sequel.",
    "VICTORY! The crowd is on its feet, and so, remarkably, is the winner."],
  loss:[
    "And down they go. The dungeon claims another contestant.",
    "That's a loss, folks. The floor remains undefeated.",
    "DEFEAT! Someone update the scoreboard, gently.",
    "The dungeon wins this round. It usually does.",
    "Down for the count. Donut looks away, tactfully.",
    "That's a loss. The sponsors are already drafting the condolence merch.",
    "The challenger falls. The dungeon, as ever, remains smug.",
    "Defeat! Somewhere, a producer sighs and reaches for the replay button.",
    "The dungeon closes the door. Softly. Permanently, for now."]};

// Touch layout (landscape): left third = defense (hold: block, swipe left: dash back);
// right two thirds = offense (tap: light, swipe right: medium, hold >=180ms: heavy until released).
const Input={q:[],held:{block:false,heavy:false},_ptrs:new Map(),DEF_ZONE:W/3,SWIPE:40,HOLD_MS:180,POWER_HOLD_MS:400,
  _powerT0:0,_powerShown:false,
  init(canvas){
    const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
    canvas.addEventListener('pointerdown',e=>{Audio.init();const p=pos(e);
      // Pause glyph hit-test: a tap there toggles pause and must not also register as a light.
      if(G.state==='FIGHT'&&G.hitPause(p.x,p.y)){G.togglePause();return}
      if(G.state==='TITLE')return G.startFight();if(G.state!=='FIGHT')return;
      const zone=p.x<this.DEF_ZONE?'def':'off';
      for(const rec of this._ptrs.values())if(rec.zone===zone)return; // one active pointer per zone
      this._ptrs.set(e.pointerId,{x0:p.x,t0:performance.now(),zone,moved:false,holdFired:false});
      if(zone==='def')this.held.block=true});
    canvas.addEventListener('pointermove',e=>{const P=this._ptrs.get(e.pointerId);if(!P||P.moved)return;const dx=pos(e).x-P.x0;
      if(Math.abs(dx)>=this.SWIPE){P.moved=true;if(P.zone==='def')this.held.block=false;else this.held.heavy=false;this.q.push(dx>0?'medium':'dashBack')}});
    const up=e=>{const P=this._ptrs.get(e.pointerId);if(!P)return;this._ptrs.delete(e.pointerId);
      if(P.zone==='def')this.held.block=false;
      else{if(!P.moved&&!P.holdFired)this.q.push('light');this.held.heavy=false}};
    canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
    this.bindButtons();
    addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();
      if(e.code==='Space'&&G.state==='TITLE'){e.preventDefault();return G.startFight()}
      if(k==='p')return G.togglePause();
      if(G.state!=='FIGHT')return;
      if(k==='j')this.q.push('light');if(k==='k')this.q.push('medium');if(k==='a')this.q.push('dashBack');
      if(k==='l')this.held.heavy=true;if(k==='s')this.held.block=true;if(k==='1'||k==='2'||k==='3')this.q.push('special'+k)});
    addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='s')this.held.block=false;if(k==='l')this.held.heavy=false})},
  // On-screen buttons: BLOCK is a hold (mirrors the field def-zone hold); PUNCH/KICK fire on press.
  // POWER taps 'powerAuto' (drain() resolves it to the highest affordable special); held past
  // POWER_HOLD_MS it shows the S1-S3 picker instead, and releasing over a chip fires that special.
  // Release point is read with elementFromPoint (not e.target) because touch pointers implicitly
  // capture to their pointerdown target, so e.target would still be #btnPower on release.
  bindButtons(){
    const id=x=>document.getElementById(x);
    const block=id('btnBlock');
    block.addEventListener('pointerdown',e=>{e.stopPropagation();Audio.init();this.held.block=true});
    const blockOff=()=>{this.held.block=false};
    block.addEventListener('pointerup',blockOff);block.addEventListener('pointercancel',blockOff);
    id('btnPunch').addEventListener('pointerdown',e=>{e.stopPropagation();Audio.init();this.q.push('light')});
    id('btnKick').addEventListener('pointerdown',e=>{e.stopPropagation();Audio.init();this.q.push('medium')});
    const power=id('btnPower'),picker=id('powerPicker');
    power.addEventListener('pointerdown',e=>{e.stopPropagation();Audio.init();this._powerT0=performance.now();this._powerShown=false});
    const powerEnd=e=>{e.stopPropagation();
      if(this._powerShown){
        const el=document.elementFromPoint(e.clientX,e.clientY),m=el&&el.id&&el.id.match(/^pk([123])$/);
        if(m&&!el.disabled)this.q.push('special'+m[1]);
        picker.classList.remove('show')}
      else if(this._powerT0)this.q.push('powerAuto');
      this._powerT0=0;this._powerShown=false};
    power.addEventListener('pointerup',powerEnd);power.addEventListener('pointercancel',powerEnd)},
  // Called once per sim frame by Ctrl.player: promotes a long press in the offense zone to a heavy
  // hold, and a long press on POWER to the S1-S3 picker (both use the same wall-clock pattern).
  tick(){for(const P of this._ptrs.values())if(!P.moved&&P.zone==='off'&&!P.holdFired&&performance.now()-P.t0>=this.HOLD_MS){P.holdFired=true;this.held.heavy=true}
    if(this._powerT0&&!this._powerShown&&performance.now()-this._powerT0>=this.POWER_HOLD_MS){this._powerShown=true;document.getElementById('powerPicker').classList.add('show')}},
  drain(){const it={light:false,medium:false,heavy:this.held.heavy,block:this.held.block,dashBack:false,special:0};
    for(const a of this.q){
      if(a==='powerAuto'){const p=G.fight?G.fight.p1.power:0;let n=0;for(let k=3;k>=1;k--)if(p>=100*k){n=k;break}it.special=n}
      else if(a.startsWith('special'))it.special=+a[7];
      else it[a]=true}
    this.q.length=0;return it}};

const Ctrl={
  EMPTY:()=>({light:false,medium:false,heavy:false,block:false,dashBack:false,special:0}),
  idle:()=>({next:()=>Ctrl.EMPTY()}),
  player:()=>({next(){Input.tick();return Input.drain()}}),
  hold:intent=>({next:()=>Object.assign(Ctrl.EMPTY(),intent)}),
  // steps: [{f, until?, intent}] in controller frames (frames where next() was called)
  script:steps=>({f:0,next(){const it=Ctrl.EMPTY();for(const s of steps)if(this.f>=s.f&&this.f<=(s.until===undefined?s.f:s.until))Object.assign(it,s.intent);this.f++;return it}}),
  // seeded chaos monkey: picks a plan, holds block/heavy plans for a while, taps others once
  random:seed=>{const r=RNG(seed);let plan='',left=0;return{next(){
    if(left--<=0){plan=r.pick(['','','light','light','medium','dashBack','block','block','heavy','special']);left=plan==='block'?10+r.int(30):plan==='heavy'?30:1}
    const it=Ctrl.EMPTY();if(plan==='block')it.block=true;else if(plan==='heavy')it.heavy=true;else if(plan==='special')it.special=1;else if(plan)it[plan]=true;return it}}}};

// All frame counts at 60 Hz. dash = px the attacker advances during startup. push = px the defender is shoved on hit.
const MOVES={
  light1:{startup:5,active:3,recovery:8, dmg:1,   range:70, hitstun:14,blockstun:9, push:18,powHit:7, powTaken:4,chain:'light2',dash:18,hitstop:3},
  light2:{startup:5,active:3,recovery:8, dmg:1,   range:70, hitstun:14,blockstun:9, push:18,powHit:7, powTaken:4,chain:'light3',dash:18,hitstop:3},
  light3:{startup:5,active:3,recovery:9, dmg:1.05,range:75, hitstun:14,blockstun:9, push:18,powHit:7, powTaken:4,chain:'light4',dash:18,hitstop:3},
  light4:{startup:6,active:3,recovery:10,dmg:1.1, range:75, hitstun:15,blockstun:10,push:20,powHit:8, powTaken:4,chain:'light5',dash:20,hitstop:3},
  light5:{startup:7,active:4,recovery:16,dmg:1.4, range:80, hitstun:20,blockstun:12,push:60,powHit:10,powTaken:5,chain:null,dash:10,knockdown:true,hitstop:5},
  medium:{startup:10,active:4,recovery:14,dmg:1.6,range:120,hitstun:18,blockstun:11,push:24,powHit:12,powTaken:6,chain:'light1',dash:140,hitstop:5},
  heavy: {charge:22,startup:8,active:5,recovery:26,dmg:2.6,range:130,hitstun:26,blockstun:14,push:70,powHit:18,powTaken:9,chain:null,knockdown:true,hitstop:9},
  s1:{startup:8, active:4,recovery:22,dmg:1.5,hits:3,gap:6,range:130,hitstun:16,blockstun:10,push:20,powHit:0,powTaken:6,cost:100,chain:null,knockdown:true,hitstop:6},
  s2:{startup:10,active:4,recovery:28,dmg:1.6,hits:5,gap:6,range:150,hitstun:16,blockstun:10,push:20,powHit:0,powTaken:6,cost:200,chain:null,knockdown:true,hitstop:8},
  s3:{startup:20,active:6,recovery:40,dmg:3,  hits:4,gap:8,range:220,hitstun:20,blockstun:0, push:90,powHit:0,powTaken:0,cost:300,chain:null,knockdown:true,unblockable:true,hitstop:14}};
const CHAMPS={
  carl: {id:'carl', name:'CARL',           cls:'brawler',  hp:1000,atk:60,color:'#f4c542',armor:0,  crit:.10,critMul:1.6,blockProf:0,  scale:1,   rig:'human'},
  donut:{id:'donut',name:'PRINCESS DONUT', cls:'caster',   hp:820, atk:70,color:'#e8a0d8',armor:0,  crit:.18,critMul:1.6,blockProf:0,  scale:1,   rig:'human'},
  katia:{id:'katia',name:'KATIA',          cls:'trickster',hp:900, atk:64,color:'#7fb0a8',armor:0,  crit:.22,critMul:1.6,blockProf:0,  scale:1,   rig:'human',
    moves:{s1:{hits:5,gap:4,dmg:1.2}}}};
const MOBS={
  goblin:   {id:'goblin',   name:'GOBLIN SCAVENGER',cls:'rogue',hp:300,atk:38,color:'#6b9a45',armor:0,  crit:.15,critMul:1.6,blockProf:0,  scale:.85,rig:'human',
    moves:{heavy:{charge:14,dmg:2.0}}},
  hobgoblin:{id:'hobgoblin',name:'HOBGOBLIN BRUTE',  cls:'tank', hp:700,atk:55,color:'#5c6b52',armor:.15,crit:.05,critMul:1.6,blockProf:.1, scale:1.2,rig:'human',
    moves:{heavy:{charge:30,dmg:3.4,hitstop:12}}}};
const DEFS=Object.assign({},CHAMPS,MOBS);

  f1_hob:   {floor:1,name:'THE DEPTHS',enemy:'hobgoblin',tier:'brute',hpMul:1,atkMul:1}};

const AI={profiles:{
    dummy:{react:0, attack:0,  block:0,  parry:0, dash:0,  special:0, heavy:0},
    basic:{react:14,attack:.04,block:.5, parry:.1,dash:.02,special:.6, heavy:0},
    brawl:{react:8, attack:.09,block:.65,parry:.3,dash:.04,special:.9, heavy:0},
    brute:{react:18,attack:.06,block:.35,parry:.05,dash:.01,special:.5,heavy:.6}},
  make(profile,seed){if(!AI.profiles[profile])throw new Error('unknown AI profile: '+profile);
    const p=AI.profiles[profile],r=RNG(seed);let hold=0,cd=0,plan=null,hHold=0;

      // `me` into CHARGE, Fighter.busy() reports true (it only excludes IDLE/BLOCK), so if this
      // returned an empty intent while charging, Fighter.act's CHARGE branch would read intent.heavy
      // as false on the next frame and cancel the charge. Mirrors the block `hold` pattern below,
      // just ahead of the short-circuit that pattern relies on BLOCK not being "busy".
      // This countdown is blind to interruption: once armed it decrements and keeps pressing heavy
      // for its full charge+1 span even if `me` gets hit, parried, or knocked down mid-charge and
      // never actually reaches CHARGE/ATTACK. That's fine today because Fighter.act only reads
      // intent.heavy while in IDLE/BLOCK (to start the charge) or CHARGE (to sustain it); in every
      // other state (HITSTUN, KNOCKDOWN, STUNNED, ...) the intent bit is simply ignored, so a stale
      // hHold countdown wastes a few frames of "would-be" input rather than corrupting behavior. It
      // would need to actually reset on interruption before an AI tier that reacts mid-swing (Phase 3)
      // could rely on hHold reflecting "still trying to land this heavy".

      // character overrides (none currently touch .range, but moveDef merges them if one ever does).
      const lightRange=me.moveDef('light1').range+20,heavyRange=me.moveDef('heavy').range+10;

      // moveDef('heavy').charge+2 frames total (this frame plus hHold's decrements below) so the

      // p.heavy>0 short-circuits before touching the rng for profiles that don't use it (heavy:0),
      // so dummy/basic/brawl draw the exact same rng sequence as before this behavior existed.
      if(p.heavy>0&&cd===0&&dist<heavyRange&&r.next()<p.heavy){hHold=me.moveDef('heavy').charge+1;it.heavy=true;cd=p.react;return it}

// Parallax dungeon stage + follow camera. Pure presentation: reads Fight/Fighter state, never writes it.
const Stage={cache:{},
  build(themeId){
    if(this.cache[themeId])return this.cache[themeId];
    const r=RNG(0xd00d),H0=FLOOR+80,cx=STAGE_W/2;
    const mk=()=>{const cv=document.createElement('canvas');cv.width=STAGE_W;cv.height=H0;return cv};
    // torches kept close to center so they stay on screen across the camera's zoom range (1.0-1.35)
    const torches=[{x:cx-150,y:225},{x:cx+150,y:225},{x:cx-255,y:235},{x:cx+255,y:235}];

    // ---- layer 0: far fog + lit archway + distant stairs (parallax .2); shows through the wall's arch cutout ----
    const far=mk(),fc=far.getContext('2d');
    let g=fc.createLinearGradient(0,0,0,H0);g.addColorStop(0,'#04050a');g.addColorStop(.55,'#0b0f1c');g.addColorStop(1,'#141a2c');
    fc.fillStyle=g;fc.fillRect(0,0,STAGE_W,H0);
    g=fc.createRadialGradient(cx,FLOOR-60,10,cx,FLOOR-60,260);
    g.addColorStop(0,'rgba(205,218,245,.75)');g.addColorStop(.4,'rgba(140,160,205,.4)');g.addColorStop(1,'rgba(140,160,205,0)');
    fc.fillStyle=g;fc.fillRect(cx-260,FLOOR-320,520,340);
    // distant stairs receding into the fog, alternating tread shade for readability
    for(let i=0;i<8;i++){const w=150-i*15,y=FLOOR-10-i*13,shade=185+i*8;
      fc.fillStyle=`rgba(${shade},${shade+6},${shade+20},${.6-i*.05})`;fc.fillRect(cx-w/2,y,w,9);
      fc.fillStyle=`rgba(${shade-30},${shade-24},${shade-10},${.5-i*.05})`;fc.fillRect(cx-w/2,y+9,w,3)}
    // faint distant pillars flanking the gate
    for(const dx of[-180,180]){fc.fillStyle='rgba(15,18,30,.7)';fc.fillRect(cx+dx-12,FLOOR-220,24,220)}

    // ---- layer 1: back wall, arches, chains, banners, torch sconces (parallax .45) ----
    const wall=mk(),wc=wall.getContext('2d');
    g=wc.createLinearGradient(0,0,0,H0);g.addColorStop(0,'#3a4258');g.addColorStop(1,'#181d2c');
    wc.fillStyle=g;wc.fillRect(0,0,STAGE_W,H0);
    // stone block coursing with mortar lines and slight per-block jitter
    const bw=58,bh=34;
    for(let y=0;y<H0;y+=bh){const rowOff=(Math.floor(y/bh)%2)*(bw/2);
      for(let x=-bw;x<STAGE_W+bw;x+=bw){const bx=x+rowOff;
        const j=r.int(14)-7;wc.fillStyle=`rgb(${58+j},${66+j},${86+j})`;
        wc.fillRect(bx+1,y+1,bw-2,bh-2)}}
    wc.strokeStyle='rgba(10,12,20,.45)';wc.lineWidth=2;
    for(let y=0;y<=H0;y+=bh){wc.beginPath();wc.moveTo(0,y+.5);wc.lineTo(STAGE_W,y+.5);wc.stroke()}
    // central lit archway: a real cutout so the fog+stairs layer behind shows through with true parallax depth
    const aw=280,ah=220,ax=cx-aw/2,ay=FLOOR-ah+40;
    const archPath=()=>{wc.beginPath();wc.moveTo(ax,FLOOR+20);wc.lineTo(ax,ay+70);wc.quadraticCurveTo(ax,ay,cx,ay);
      wc.quadraticCurveTo(ax+aw,ay,ax+aw,ay+70);wc.lineTo(ax+aw,FLOOR+20);wc.closePath()};
    wc.save();archPath();wc.clip();wc.clearRect(ax-4,ay-4,aw+8,FLOOR+24-ay+4);wc.restore();
    wc.save();archPath();wc.strokeStyle='#0e1119';wc.lineWidth=12;wc.stroke();
    wc.strokeStyle='#4a5470';wc.lineWidth=3;wc.stroke();wc.restore();
    // flanking blind arches (recessed niches), tucked close to the main arch so they stay in frame
    for(const dx of[-255,255]){const nx=cx+dx;
      g=wc.createLinearGradient(nx-55,0,nx+55,0);g.addColorStop(0,'#0f121c');g.addColorStop(.5,'#1e2536');g.addColorStop(1,'#0f121c');
      wc.fillStyle=g;wc.beginPath();wc.moveTo(nx-55,FLOOR+10);wc.lineTo(nx-55,FLOOR-130);wc.quadraticCurveTo(nx,FLOOR-180,nx+55,FLOOR-130);
      wc.lineTo(nx+55,FLOOR+10);wc.closePath();wc.fill();
      wc.strokeStyle='#0c0e16';wc.lineWidth=5;wc.stroke()}
    // hanging chains: start below the camera's visible-top edge at every zoom (worst case ~180 at zoom 1.35)
    // so the links are always on screen, with a wall bracket marking the mount point.
    const chainXs=[cx-330,cx-190,cx+190,cx+330,cx-70,cx+70],chainY0=200;

      wc.strokeStyle='#12141c';wc.lineWidth=3;
      for(let y=0;y<len;y+=14){wc.beginPath();wc.ellipse(cxs+((y/14)%2?3:-3),chainY0+y,5,7,0,0,Math.PI*2);wc.stroke()}

  eq(s2n,1,'s2 recipe fires once, on the moveName transition');eq(l1n,5,'one light thud per landed sub-hit')});
Test.add('crit rolls from the fight rng and multiplies damage; noCrit disables',()=>{const a=mkFight({ctrl1:Ctrl.script([L(0)]),noCrit:false,seed:3});a.p1.def=Object.assign({},CHAMPS.carl,{crit:1});closeIn(a);run(a,5);eq(a.p2.hp,1000-Math.round(60*1.6));const b=mkFight({ctrl1:Ctrl.script([L(0)])});b.p1.def=Object.assign({},CHAMPS.carl,{crit:1});closeIn(b);run(b,5);eq(b.p2.hp,940)});

Test.add('a missed parry locks out re-parry for PARRY_LOCKOUT frames',()=>{const mash=Ctrl.script(Array.from({length:40},(_,i)=>({f:i*7,until:i*7+5,intent:{block:true}})));const f=mkFight({ctrl1:Ctrl.script([L(0,300)]),ctrl2:mash});closeIn(f);run(f,300);const parries=f.log.filter(e=>e.type==='parry').length;ok(parries<=2,'mash parries: '+parries);const hold=mkFight({ctrl1:Ctrl.script([L(0,300)]),ctrl2:Ctrl.hold({block:true})});closeIn(hold);run(hold,300);ok(hold.p2.hp>=f.p2.hp-50,'holding is not much worse than mashing')});
Test.add('per-champion move overrides merge over MOVES',()=>{const F=new Fighter(DEFS.goblin,-1,Ctrl.idle());eq(F.moveDef('heavy').charge,14);eq(F.moveDef('light1').startup,MOVES.light1.startup);const H=new Fighter(DEFS.hobgoblin,-1,Ctrl.idle());eq(H.moveDef('heavy').hitstop,12)});
Test.add('medium as a combo ender pushes the defender out of light range',()=>{
  // Chain 3 lights (light1/2/3 all have a non-null .chain) then, from light3's recovery, cancel
  // into a medium (script: light only through frame 23, medium from frame 24 on — the frame light3
  // enters recovery, verified against the fight's own frame counter, not guessed) so the ender
  // branch (att.moveName==='medium'&&att.combo>=3) is actually exercised, not just incidentally
  // satisfied by prior pushback. Capture the landing hit's attacker via a wrapped onEvent (Fight.emit
  // hands it the live Fighter, so a.moveName/a.combo reflect that exact hit) and diff its knockback
  // against a plain medium thrown from IDLE with combo 0. Both scenarios share identical dash/
  // separate() contamination on the hit-landing step (medium's approach dash runs through
  // f<=startup, which is also its first active frame, so the last dash increment and the hit
  // resolve in the same step), so the *difference* between the two deltas isolates the push
  // (90 vs MOVES.medium.push) exactly, independent of that shared collision noise.
  let capture=null;
  const f=mkFight({ctrl1:Ctrl.script([{f:0,until:23,intent:{light:true}},{f:24,until:60,intent:{medium:true}}]),
    onEvent:(type,a)=>{if(type==='hit'&&a.moveName==='medium'&&!capture)capture={moveName:a.moveName,combo:a.combo}}});
  f.p2.x=STAGE_W/2;closeIn(f); // room to be pushed; hitstop pauses Fight.frame for a few steps per landed hit, so budget generously
  let dx=0;
  for(let i=0;i<70&&dx===0;i++){const before=f.p2.x;f.step();const last=f.log[f.log.length-1];
    if(capture&&last&&last.type==='hit'&&last.f===f.frame&&last.who===1)dx=f.p2.x-before}
  ok(capture,'medium landed as the chain-cancel finisher');eq(capture.moveName,'medium');ok(capture.combo>=4,'combo at ender: '+capture.combo);
  const g=mkFight();closeIn(g);g.p1.combo=0;g.p1.startMove('medium');
  let dx2=0;
  for(let i=0;i<40&&dx2===0;i++){const before=g.p2.x;g.step();const last=g.log[g.log.length-1];
    if(last&&last.type==='hit'&&last.f===g.frame)dx2=g.p2.x-before}
  ok(dx2<60,'non-ender medium push stays well under 90, got '+dx2);
  eq(dx-dx2,90-MOVES.medium.push,'ender push (90) vs normal push ('+MOVES.medium.push+') differential; dx='+dx+' dx2='+dx2)});

Test.add('FX ages once per sim tick in sim mode, deterministically (not off wall-clock rAF)',()=>{
  const runOnce=()=>{
    const f=mkFight({ctrl1:Ctrl.script([L(0)])});closeIn(f);
    G.fight=f;G.state='FIGHT';G.sim=true;G._tickN=0;FX.reset();
    for(let i=0;i<8;i++)G.tick(); // lands the scripted light1, queueing a spark via Fight.resolve
    ok(FX.list.some(p=>p.kind==='spark'),'hit landed and queued a spark');
    for(let i=0;i<10;i++)G.tick(); // 10 further sim ticks, each aging FX exactly once via G.tick
    return FX.list.length};
  const a=runOnce(),b=runOnce();
  eq(a,b,'identical script/seed -> identical FX state after the same tick count');
  G.fight=null;G.state='TITLE';G.sim=false});
