<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Carl's Doorway Brawl</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#090b12;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;touch-action:none;user-select:none}

/* Positioned in JS (G.positionToast, called from G.fit on load/resize) off canvas.getBoundingClientRect()

/* Task 4.5: meta screens (title/map/roster/crystal/shop/arena). .panel (above) stays the narrow

   uses so it can hold cards/paths/tabs at 854x480 without scrolling. */
#titleLogo{font-size:26px;letter-spacing:1px;transform:scaleX(.88);transform-origin:center;font-weight:900;line-height:1.15}

/* Task 4.6: was justify-content:flex-start, which left 1-2 champions pinned to the top of the

   and the transition between those two densities is smooth (no snap from "centered" to "top-anchored"
   at some champion-count threshold). */

</style></head><body><div id="wrap"><canvas id="game" width="854" height="480"></canvas>
<div id="btns">
<button id="btnBlock" class="cbtn" data-label="BLOCK"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5 19.5 5.5V11C19.5 16 16 20 12 21.5 8 20 4.5 16 4.5 11V5.5Z"/></svg></button>

</div><script>

'use strict';
const W=854,H=480,FLOOR=400,STEP=1/60;
const canvas=document.getElementById('game');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
// Screen-space y a rig's topmost point must clear: portraits/hp bars end around y=70, the floor-line
// text around y=96, so 104 leaves a few px of breathing room. Shared by Camera's per-fight zoom cap
// (65_stage.js/80_game.js) and its own regression test (90_tests.js) so all three read one number.
const HUD_LINE=104;
// xorshift32; deterministic per seed. Never use Math.random inside the sim.
function RNG(seed){let s=(seed>>>0)||0x9e3779b9;return{
  next(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296},
  int(n){return Math.floor(this.next()*n)},
  pick(a){return a[this.int(a.length)]}}}

'use strict';
// Meta: the pure data layer for Phase 4 (roster, crystals, quests, rewards, arena, energy). No
// DOM references live here — screens (85_screens.js, later tasks) read/write through these
// functions only. Meta randomness (crystals, later tasks) draws from RNG(Save.data.seed++); wall
// clock only ever enters through Energy.now, which is injectable for deterministic tests.
const Meta={
  defaults(){
    return{v:2,seed:1,gold:0,units:0,iso:0,
      cats:{brawler:0,rogue:0,caster:0,tank:0,beast:0,trickster:0},
      roster:{carl:{stars:1,rank:1,level:1,xp:0,shards:0}},
      active:'carl',
      floors:{1:{nodes:['open','locked','locked','locked','locked'],boss:'locked'}},
      energy:{n:Energy.max,max:Energy.max,ts:0},
      arena:{best:0,streak:0},
      // pity[kind]: opens of that crystal kind since its last pity-floor trigger (Task 4.2's
      // Crystal.open); not part of the Phase 4 plan's original defaults() shape (frozen before
      // pity was designed), added here so migrate()'s generic top-level fill loop below covers
      // pre-4.2 v2 saves for free.
      pity:{},
      mute:false,settings:{},stats:{fights:0,wins:0}}},
  // v1 -> v2: keep gold/units/mute/settings, everything else starts fresh (including roster, which
  // v1 saves never meaningfully populated). v2 -> v2: fill in any keys/sub-keys a save from an
  // earlier Phase 4 build is missing, in place, without discarding what's already there. Anything
  // else (null, a non-object, or an unrecognized v) resets to defaults().
  migrate(data){
    if(!data||typeof data!=='object')return Meta.defaults();
    if(data.v===1){
      const d=Meta.defaults();
      d.gold=data.gold||0;d.units=data.units||0;d.mute=!!data.mute;
      d.settings=data.settings&&typeof data.settings==='object'?data.settings:{};
      return d}
    if(data.v===2){
      const d=Meta.defaults();
      for(const k in d)if(!(k in data))data[k]=d[k];
      for(const k in d.cats)if(!(k in data.cats))data.cats[k]=d.cats[k];
      for(const k in d.energy)if(!(k in data.energy))data.energy[k]=d.energy[k];
      for(const k in d.arena)if(!(k in data.arena))data.arena[k]=d.arena[k];
      for(const k in d.stats)if(!(k in data.stats))data.stats[k]=d.stats[k];
      if(!data.roster||typeof data.roster!=='object'||!Object.keys(data.roster).length)data.roster=d.roster;
      return data}
    return Meta.defaults()},
  // Fix round 1 (Task 4.5 controller review, Minor): the SPONSOR PERK KIOSK's ISO PACK (200 gold ->
  // 60 iso) has no dedicated Meta function of its own yet -- added here rather than left as a
  // Screens-side Rewards.grant({gold:-200,...}) reuse, same refuse-when-short/deduct-then-Save.put
  // shape as Roster.levelUp/rankUp right below.
  buyIso(){
    const cost=200,gain=60;
    if((Save.data.gold||0)<cost)return false;
    Save.data.gold-=cost;
    Save.data.iso=(Save.data.iso||0)+gain;
    Save.put();
    return true}};
const Stats={
  caps:{stars:[1,5],rank:stars=>stars,level:rank=>10*rank},
  xpToLevel(level){return 40*level},
  clampEntry(entry){
    entry.stars=clamp(entry.stars,Stats.caps.stars[0],Stats.caps.stars[1]);
    entry.rank=clamp(entry.rank,1,Stats.caps.rank(entry.stars));
    entry.level=clamp(entry.level,1,Stats.caps.level(entry.rank));
    return entry},
  derive(def,entry){
    const mul=(1+.25*(entry.stars-1))*(1+.10*(entry.rank-1))*(1+.01*(entry.level-1));
    return{hp:Math.round(def.hp*mul),atk:Math.round(def.atk*mul)}}};
// Energy.max is the single source of truth for the energy cap (Save.data.energy.max is only a
// mirror of it, set from here in Meta.defaults, kept in the save shape for Screens to read later —
// tick/spend never read e.max so there is exactly one place this constant can drift from).
const Energy={
  now:()=>Date.now(),
  max:10,
  // Fix-wave item 1 (Critical): e.ts defaulted to 0 (Meta.defaults) and was only ever advanced by
  // regen*360000 -- never anchored to a real Energy.now() timestamp -- so now-ts was always ~57
  // real years and tick() refilled to max on the very first call, making the energy gate inert.
  // tick() now re-anchors e.ts=Energy.now() whenever n is already at/over max (both "never spent
  // yet" and "just regenerated back to max"), so the NEXT spend-from-full has an honest starting
  // point; spend() (below) anchors it directly at the moment of the transition out of full, which
  // is the actual event regen should be measured from.
  tick(){
    const e=Save.data.energy;
    const regen=Math.min(Math.floor((Energy.now()-e.ts)/360000),Energy.max-e.n);
    if(regen>0){e.n+=regen;e.ts+=regen*360000}
    if(e.n>=Energy.max)e.ts=Energy.now();
    return e.n},
  spend(n){
    const e=Save.data.energy;
    if(e.n<n)return false;
    if(e.n===Energy.max)e.ts=Energy.now();
    e.n-=n;return true}};
// Crystal.KINDS/open reference CHAMPS (40_movedata.js), which the build concatenates AFTER this
// file — safe because these are only read inside a function body, called well after the whole
// script has loaded (the same later-file-from-earlier-file pattern 45_encounter.js already uses
// for BUFFS, defined in 47_buffs.js).
const Crystal={
  KINDS:{
    basic:  {cost:{units:0,  gold:500},odds:[[1,.70],[2,.25],[3,.05]]},
    premium:{cost:{units:100          },odds:[[2,.60],[3,.32],[4,.08]]}},
  // Pure weighted draw off an odds table [[tier,prob],...] (probs sum to 1); the single random
  // decision in a crystal open. Kept separate from open() so tests can measure the raw table's
  // distribution directly, without pity or roster/dup effects mixed in.
  rollTier(odds,rng){
    const r=rng.next();let acc=0;
    for(const[tier,p]of odds){acc+=p;if(r<acc)return tier}
    return odds[odds.length-1][0]},
  // xorshift32's first output from a small, low-entropy seed (1, 2, 3, ... — exactly what
  // Save.data.seed++ produces) is badly under-mixed: RNG(1).next()===0.0000629..., RNG(2).next()
  // is almost exactly double that, and so on for thousands of seeds, which skews any single draw
  // taken immediately off a freshly-seeded RNG toward the low end (verified: raw first-draw tier
  // frequencies over seeds 1..10000 came out 100/0/0 against basic's 70/25/5 odds instead of
  // matching them). One throwaway warm-up call fixes it (same seeds then measure 70.06/24.88/5.06)
  // — this is the standard fix for a freshly-seeded PRNG's under-mixed first output, not a
  // workaround for a test; every real RNG(Save.data.seed++) instance in open() needs it too.
  rng(seed){const r=RNG(seed);r.next();return r},
  // One RNG instance per open (both the tier roll and the champion pick draw from it, after the
  // warm-up draw above), seeded from Save.data.seed++ so every open — including a pity-forced one
  // — advances the save's random stream exactly once. Refusing for cost never touches the seed or
  // pity counter: nothing about the save changes on a refusal.
  open(kind){
    const k=Crystal.KINDS[kind];
    if(!k)throw new Error('unknown crystal kind: '+kind);
    for(const c in k.cost)if((Save.data[c]||0)<k.cost[c])return null;
    for(const c in k.cost)Save.data[c]-=k.cost[c];
    const rng=Crystal.rng(Save.data.seed++);
    let stars=Crystal.rollTier(k.odds,rng);
    if(!Save.data.pity)Save.data.pity={};
    const pity=(Save.data.pity[kind]||0)+1;
    // "the kind's second-highest tier" (Phase 4 ruling): one below the top of that kind's odds
    // table — basic's top is 3-star so its pity floor is 2-star, premium's top is 4-star so 3-star.
    const pityFloor=k.odds[k.odds.length-1][0]-1;
    if(pity>=10){
      if(stars<pityFloor)stars=pityFloor;
      Save.data.pity[kind]=0}
    else Save.data.pity[kind]=pity;
    const champId=rng.pick(Object.keys(CHAMPS));
    const roster=Save.data.roster;
    let result;
    if(roster[champId]){
      const entry=roster[champId];
      entry.shards=(entry.shards||0)+1;
      while(entry.shards>=5&&entry.stars<5){entry.shards-=5;entry.stars++}
      result={champId,stars:entry.stars,dup:true,shards:entry.shards}}
    else{
      roster[champId]={stars,rank:1,level:1,xp:0,shards:0};
      result={champId,stars,dup:false}}
    Save.put();
    return result}};
// Quest/Rewards/Roster/Arena reference FLOORS/ENCOUNTERS/DEFS/BUFFS (45_encounter.js/47_buffs.js,
// concatenated after this file) and G is never touched here — same later-file-from-earlier-file,
// no-DOM pattern as Crystal above.
const Quest={
  // Read floor n's current playable state: Phase 3's static FLOORS def merged with Save.data's
  // per-node progress. null when either side is missing — an as-yet-uncreated floor (Save.data),
  // or a floor number FLOORS itself never defined (only 1-2 exist today).
  floor(n){
    const def=FLOORS[n-1];
    const save=Save.data.floors[n];
    if(!def||!save)return null;
    return{floor:n,name:def.name,
      nodes:def.nodes.map((id,i)=>({id,state:save.nodes[i],enc:id})),
      boss:{id:def.boss,state:save.boss,enc:def.boss}}},
  canStart(n,k){
    const f=Quest.floor(n);
    if(!f)return false;
    const node=k==='boss'?f.boss:f.nodes[k];
    if(!node||node.state!=='open')return false;
    return Save.data.energy.n>=1},
  start(n,k){
    if(!Quest.canStart(n,k))return null;
    const f=Quest.floor(n);
    const node=k==='boss'?f.boss:f.nodes[k];
    if(!Energy.spend(1))return null;
    Save.put();
    return node.id},

  forNode(n,k){

  grant(r){

// right two thirds = offense (tap: light, swipe right: medium, hold >=180ms: heavy until released).
const Input={q:[],held:{block:false,heavy:false},_ptrs:new Map(),DEF_ZONE:W/3,SWIPE:40,HOLD_MS:180,POWER_HOLD_MS:400,
  _powerT0:0,_powerShown:false,
  init(canvas){
    const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
    canvas.addEventListener('pointerdown',e=>{Audio.init();const p=pos(e);

      if(G.state==='FIGHT'&&G.hitPause(p.x,p.y)){G.togglePause();return}
      if(G.state==='TITLE')return G.startFight();if(G.state!=='FIGHT')return;
      const zone=p.x<this.DEF_ZONE?'def':'off';
      for(const rec of this._ptrs.values())if(rec.zone===zone)return; // one active pointer per zone
      this._ptrs.set(e.pointerId,{x0:p.x,t0:performance.now(),zone,moved:false,holdFired:false});
      if(zone==='def')this.held.block=true});
    canvas.addEventListener('pointermove',e=>{const P=this._ptrs.get(e.pointerId);if(!P||P.moved)return;const dx=pos(e).x-P.x0;
      if(Math.abs(dx)>=this.SWIPE){P.moved=true;if(P.zone==='def')this.held.block=false;else this.held.heavy=false;this.q.push(dx>0?'medium':'dashBack')}});
    const up=e=>{const P=this._ptrs.get(e.pointerId);if(!P)return;this._ptrs.delete(e.pointerId);
      if(P.zone==='def')this.held.block=false;
      else{if(!P.moved&&!P.holdFired)this.q.push('light');this.held.heavy=false}};
    canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
    this.bindButtons();
    addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();
      if(e.code==='Space'&&G.state==='TITLE'){e.preventDefault();return G.startFight()}
      if(k==='p')return G.togglePause();
      if(G.state!=='FIGHT')return;
      if(k==='j')this.q.push('light');if(k==='k')this.q.push('medium');if(k==='a')this.q.push('dashBack');
      if(k==='l')this.held.heavy=true;if(k==='s')this.held.block=true;if(k==='1'||k==='2'||k==='3')this.q.push('special'+k)});
    addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='s')this.held.block=false;if(k==='l')this.held.heavy=false})},
  // On-screen buttons: BLOCK is a hold (mirrors the field def-zone hold); PUNCH/KICK fire on press.
  // POWER taps 'powerAuto' (drain() resolves it to the highest affordable special); held past
  // POWER_HOLD_MS it shows the S1-S3 picker instead, and releasing over a chip fires that special.
  // Release point is read with elementFromPoint (not e.target) because touch pointers implicitly
  // capture to their pointerdown target, so e.target would still be #btnPower on release.

    const blockOff=()=>{this.held.block=false};
    block.addEventListener('pointerup',blockOff);block.addEventListener('pointercancel',blockOff);

    id('btnKick').addEventListener('pointerdown',e=>{e.stopPropagation();Audio.init();this.q.push('medium')});

  // hold, and a long press on POWER to the S1-S3 picker (both use the same wall-clock pattern).

const Ctrl={
  EMPTY:()=>({light:false,medium:false,heavy:false,block:false,dashBack:false,special:0}),
  idle:()=>({next:()=>Ctrl.EMPTY()}),
  player:()=>({next(){Input.tick();return Input.drain()}}),
  hold:intent=>({next:()=>Object.assign(Ctrl.EMPTY(),intent)}),
  // steps: [{f, until?, intent}] in controller frames (frames where next() was called)
  script:steps=>({f:0,next(){const it=Ctrl.EMPTY();for(const s of steps)if(this.f>=s.f&&this.f<=(s.until===undefined?s.f:s.until))Object.assign(it,s.intent);this.f++;return it}}),
  // seeded chaos monkey: picks a plan, holds block/heavy plans for a while, taps others once
  random:seed=>{const r=RNG(seed);let plan='',left=0;return{next(){
    if(left--<=0){plan=r.pick(['','','light','light','medium','dashBack','block','block','heavy','special']);left=plan==='block'?10+r.int(30):plan==='heavy'?30:1}
    const it=Ctrl.EMPTY();if(plan==='block')it.block=true;else if(plan==='heavy')it.heavy=true;else if(plan==='special')it.special=1;else if(plan)it[plan]=true;return it}}},
  // Ctrl.competent(seed): a scripted, fully deterministic "skilled human" bot for tests/batch.py's
  // win-rate table (--bot auto). Unlike Ctrl.random it never rolls dice — `seed` is accepted only for
  // signature symmetry with the other seeded controllers (Ctrl.random, AI.make); the exact same
  // (fight, me, foe) state always yields the exact same intent, for any seed, which is what the
  // batch tool's "Ctrl.competent is deterministic" test checks. Priority order per call:
  //   1. continue holding a heavy already armed by step 8 below (charge moves need intent.heavy held
  //      every frame — see Fighter.act's CHARGE branch — checked ahead of the busy() gate the same
  //      way AI.make's decideHeavy 'hold' phase does, since CHARGE itself counts as busy)
  //   2. finish a light chain already open (Fighter.act's own recovery+chain+landed window)
  //   3. otherwise, if busy, do nothing (can't act)
  //   4. react to a visible medium/heavy: block once its startup clock has run REACT frames (leaves
  //      the move's last couple of startup frames as a buffer, mirroring the AI tiers' 'react' field)
  //   5. bail out of a telegraphed heavy charge while low on hp
  //   6. fire the strongest special affordable
  //   7. chain lights whenever in light range
  //   8. Fix-wave item 8: every 5th time the foe enters blockstun (a mix-up, not spam — counted on
  //      the rising edge of BLOCKSTUN so one long blockstun window only counts once), arm a heavy
  //      instead of continuing the light chain
  //   9. Fix-wave item 8: close distance with a medium (its own startup dash covers real ground) when
  //      out of light range and the foe isn't mid-attack, on a 40-frame cooldown — the bot used to
  //      just stand there outside light range forever, which is why intercept/medium-punish never
  //      fired in the run that certified the tiers (final review, Important) and the monotone curve
  //      was driven almost entirely by `attack`.
  competent:seed=>{const REACT=6,LOW_HP=0.3,CLOSE_CD=40,MIXUP_EVERY=5;
    let closeCd=0,openings=0,wasBlockstun=false,heavyHold=0;
    return{next(fight,me,foe){
    const it=Ctrl.EMPTY();
    if(heavyHold>0){heavyHold--;it.heavy=true;return it}
    if(me.state==='ATTACK'&&me.phase()==='recovery'&&me.move.chain&&me.landed){it.light=true;return it}
    if(me.busy())return it;
    if(foe.state==='ATTACK'&&(foe.moveName==='medium'||foe.moveName==='heavy')&&foe.f>=REACT){it.block=true;return it}
    if(foe.state==='CHARGE'&&foe.moveName==='heavy'&&me.hp/me.maxHp<LOW_HP){it.dashBack=true;return it}
    if(me.power>=100){it.special=me.power>=300?3:me.power>=200?2:1;return it}
    if(closeCd>0)closeCd--;
    const foeBlockstun=foe.state==='BLOCKSTUN';
    if(foeBlockstun&&!wasBlockstun){
      wasBlockstun=true;openings++;
      if(openings%MIXUP_EVERY===0){heavyHold=me.moveDef('heavy').charge+1;it.heavy=true;return it}}
    else if(!foeBlockstun)wasBlockstun=false;
    const dist=Math.abs(foe.x-me.x)-me.width,lightRange=me.moveDef('light1').range+20;
    if(dist<lightRange){it.light=true;return it}
    if(foe.state!=='ATTACK'&&closeCd===0){it.medium=true;closeCd=CLOSE_CD;return it}
    return it}}}};

// frozen interfaces list. BUFFS[id] = {id, onFrame?(fight,holder,foe), onHit?(fight,att,def,ref,holder),
// onBlock?(fight,att,def,ref,holder)}. `holder` is the fighter whose buffs list this call came from

    // the frozen plan's spec (0.05%/frame) is actually 3%/s — 360% of max hp over Mother Rat's own
    // 120s fight clock — which the plan's own 600-frame (10s) regen test never surfaced since 10s of

    // (setState below), stays true through the knockdown timer and the post-getup invulnerable
    // window, then self-clears in tick() the frame after inv actually reaches 0 — giving AI.make's
    // 'punish' behavior a one-frame window to catch "just got up" that's scoped to real knockdowns
    // only. Previously that same one-frame window was inferred from a plain inv 1->0 edge, which
    // happened to also work for KNOCKDOWN's own get-up i-frames (10) only because they outlast
    // DASH_BACK's own i-frames (8) relative to its 12-frame duration — a coincidence of those two
    // constants, not a real invariant, so nothing stopped a future DASH_BACK retune from making a
    // plain dash-back misread as a knockdown get-up. This flag is scoped to KNOCKDOWN specifically
    // and never touches DASH at all.

    // regardless of state — see tick()'s own comment for why this replaced the old state==='IDLE'
    // gate (a controller, AI.make's decidePunish, used to reach into the OPPONENT Fighter it doesn't
    // own and clear wasKnockedDown itself the moment it acted on the window, exactly to paper over
    // that gate's one real gap: if the foe's OWN controller made it act this same frame, its state
    // could read something other than IDLE right when tick()'s old check ran, leaving the flag stuck

// Resolves a def's look, falling back to LOOKS.carl (once, with a console.warn) for a Phase-3-added
// def that ships without one, instead of every reader (Rig.draw, Render.overlayY/shadow) crashing on
// an unguarded F.def.look dereference. Shared across 68_rig.js/70_render.js via plain global scope.
let _warnedNoLook=false;
function lookFor(def){
  if(def.look)return def.look;
  if(!_warnedNoLook){_warnedNoLook=true;
    console.warn('Rig: def "'+(def.id||'?')+'" has no .look; falling back to LOOKS.carl')}
  return LOOKS.carl}

// ---- forward kinematics ----
const Rig={
  bones:['hip','torso','neck','head','lShoulder','lElbow','lHand','rShoulder','rElbow','rHand','lHip','lKnee','lFoot','rHip','rKnee','rFoot'],
  bonesQuad:QUAD_BONES,
  // A prop draws geometry beyond any joint solve() returns (a dagger's blade tip, a horn's curl, a
  // club's head) — Rig.extent (below) needs those extremes too, or a look wearing one could still
  // clip the HUD even though every *joint* is accounted for. Duplicates just the tip/extent math from
  // each prop's drawing code in draw()/drawBig()/drawQuad() (not full rendering — extent only cares
  // about the furthest point(s) a prop's stroke/fill reaches), keyed by the same prop id string
  // look.props uses. face is passed through rather than assumed 1 so a caller iterating both facings
  // could in principle use this directly, though Rig.extent itself only ever samples face=1 (the FK
  // is symmetric under a face flip, so the magnitude — what extent cares about — doesn't change).
  propExtra(propId,look,j,face){
    if(propId==='dagger'){ // human rig: blade tip off j.rHand, same direction math as draw()'s dagger
      const h=j.rHand,len=look.armLen*.46,n=Math.hypot(face,-.32),dx=face/n,dy=-.32/n;
      return[{x:h.x+dx*len,y:h.y+dy*len}]}
    // human rig: Hobgoblin's club (draw()'s shaft, kept in sync — see its Fix-wave item 4 comment).
    // Restored to its real length now that the per-frame zoom cap (G.topNow/Rig.topAt) means a tall
    // prop only taxes the frames it's actually held up in, not the whole fight.
    if(propId==='club'){const h=j.rHand;return[{x:h.x+face*12,y:h.y-30}]}
    if(propId==='spikedclub'){const h=j.rHand,len=look.armLen*.6;return[{x:h.x+face*len*.3,y:h.y-len}]}
    if(propId==='horns'){const r=look.headR;
      return[-1,1].map(s=>({x:j.head.x+s*r*1.05,y:j.head.y-r*2.1}))}
    if(propId==='tiara'){const w=look.headR*.7,h=look.headR*.42,cy=j.head.y-look.headR*.9;
      return[{x:j.head.x,y:cy-h*.2},{x:j.head.x-w,y:cy+h},{x:j.head.x+w,y:cy+h}]}
    if(propId==='whiskers'){const wx=j.head.x+face*look.headR*.68,wy=j.head.y+look.headR*.12;
      return[{x:wx+face*look.headR*1.35,y:wy}]}
    if(propId==='teeth'){const tx=j.head.x+face*look.headR*.85;
      return[{x:tx+face*7,y:j.head.y+look.headR*.25}]}
    return[]}, // 'vest','boxers','bandages','gear','rags','trousers','scars','segments': stay within
               // joint bounds (torso/hip/limb strokes), no separate extent contribution.
  // Worst-case {top, reach} (both positive) a look can strike across EVERY pose it can reach, sampled
  // at every keyframe and its neighbors' midpoint (not just t=0/.5/1 globally — a multi-keyframe
  // flurry like s3 has real peaks at interior keyframes a coarse global sample could straddle and
  // miss), plus every prop's own geometry via propExtra above. Computed once per (look, scale) and
  // cached on the look itself — this walks every pose key's full FK plus props, so it's not free, but
  // it never changes for a given look/scale pair.
  // top = height above the floor, INCLUDING each pose's own off.y (a crouch/lunge genuinely changes
  // how high the rig's own base sits, and that's exactly the real screen-space clipping G's zoom cap
  // (80_game.js) needs to know about — see the "big rig idle height"/HUD zoom-cap tests, where this
  // is the whole point of the fix).
  // reach = max |x| from the fighter's own x, EXCLUDING each pose's own off.x. EDGE_PAD's own
  // definition (see its comment in 40_movedata.js) has always meant "how far the rig's limbs reach
  // from the fighter's actual sim x" — a static, proportion-driven number the wall-clamp sizes itself
  // against — not "how far a specific attack's cosmetic forward-lean animation (POSES.s3's off.x:46,
  // purely a render-time flourish; the sim's own x for s3 never moves, unlike a dash-tagged move) can
  // fling the rendered hand." Including off.x here was tried first and made carl/hobgoblin/donut/
  // mother_rat/mongo/grull *all* fail this test at 1.5-2x EDGE_PAD — a real (and probably worth its
  // own future task) latent gap between how far s3's pose art reaches and how much wall margin the sim
  // reserves, but not something this rig/camera fix round should silently paper over by inflating
  // EDGE_PAD or rewriting other characters' frozen pose data. Subtracting each sample's own off.x
  // before folding it into reach is valid because off.x only ever enters the FK once, as a straight
  // additive shift to hip.x that every other joint's position is built from (sin/cos terms all compose
  // on top of it) — so undoing it after the fact is exactly equivalent to solving with off.x=0.
  // opts.excludePoses (default none): pose keys to skip entirely — used ONLY by G.startFight's
  // per-fight camera zoom cap (Fix round 2, controller review), to leave out 'win'/'ko': those play
  // under the RESULT overlay after the fight is already over, not during ordinary play, so their own
  // (often raised-arm) height shouldn't drag every fight's normal zoom cap down. The reach test (and
  // anything else caring about the true worst case) always calls extent() with no opts, so it still
  // sees every pose. Folded into the cache key (scale plus a sorted, joined excludePoses string) so
  // the two call shapes cache independently instead of clobbering each other.
  extent(look,scale,opts){
    scale=scale||1;
    const excl=opts&&opts.excludePoses;
    const cacheKey=scale+(excl&&excl.length?'|excl:'+excl.slice().sort().join(','):'');
    look._extentCache=look._extentCache||{};
    if(look._extentCache[cacheKey])return look._extentCache[cacheKey];
    const table=look.rig==='quad'?POSES_QUAD:look.rig==='big'?POSES_BIG:POSES;
    const skip=excl&&excl.length?new Set(excl):null;
    let minY=0,maxReach=0;
    for(const key in table){
      if(skip&&skip.has(key))continue;
      const kf=table[key];
      for(let i=0;i<kf.length-1;i++){
        const ta=kf[i].t,tb=kf[i+1].t;
        for(const t of[ta,(ta+tb)/2,tb]){
          const offX=samplePose(table,key,t).off.x||0;
          const j=this.solve(look,key,t,1);
          const fold=(x,y)=>{if(y<minY)minY=y;const rx=Math.abs(x-offX);if(rx>maxReach)maxReach=rx};
          for(const b in j)fold(j[b].x,j[b].y);

          // (draw()/drawBig()/drawQuad()'s own c.arc(j.head.x,j.head.y,look.headR,...) calls), which
          // every joint-only fold above misses entirely — j.head is the circle's CENTER, not its
          // topmost/widest point. Deficit was 11-34px across the roster (Mongo 32.5px at his 1.25
          // scale), enough to put his head 28px into the HUD at his pair cap. Folding the two top
          // corners of the circle's bounding square is a deliberately cheap, slightly-conservative
          // stand-in for the true circle bound (its exact top point is (j.head.x, j.head.y-headR),
          // its exact side points are ((j.head.x±headR, j.head.y)) — the corners fold BOTH top and
          // reach through the same two fold() calls without adding a third).
          fold(j.head.x-look.headR,j.head.y-look.headR);
          fold(j.head.x+look.headR,j.head.y-look.headR);
          for(const propId of look.props||[])
            for(const ep of this.propExtra(propId,look,j,1))fold(ep.x,ep.y)}}}
    const result={top:-minY*scale,reach:maxReach*scale};
    return look._extentCache[cacheKey]=result},
  // Fix-wave item 4: the per-frame counterpart to extent() above — instead of the worst case across

  // now (poseKey/t01, from poseFor(f)), so a single tall pose (e.g. Carl's own 'dash' lunge) doesn't
  // tax the camera's zoom cap for the whole fight, only the frames it's actually on screen for. Same
  // fold as extent() (every joint, the head circle's bounding corners, every prop's own geometry) but
  // for one sample instead of walking every keyframe. t01 is quantized to the nearest 1/20 (0.05) so
  // a fight's continuously-varying t01 collapses onto a small, stable set of cache entries per (look,
  // poseKey) instead of allocating one entry per distinct floating-point t01 ever seen — checked to
  // cost nothing measurable against --perf 300 (see docs/ARENA.md's fix-wave notes).
  topAt(look,poseKey,t01,scale){
    scale=scale||1;
    const qt=Math.round(clamp(t01,0,1)*20)/20;
    const cacheKey=poseKey+'|'+scale+'|'+qt;
    look._topCache=look._topCache||{};
    const cached=look._topCache[cacheKey];
    if(cached!==undefined)return cached;
    const j=this.solve(look,poseKey,qt,1);
    let minY=0;
    for(const b in j)if(j[b].y<minY)minY=j[b].y;
    if(j.head.y-look.headR<minY)minY=j.head.y-look.headR;
    for(const propId of look.props||[])
      for(const ep of this.propExtra(propId,look,j,1))if(ep.y<minY)minY=ep.y;
    return look._topCache[cacheKey]=-minY*scale},
  poseFor(f){
    const st=f.state;
    // A fighter has no dedicated locomotion state; the only x movement while IDLE comes from
    // Fight.separate()'s overlap push, read here off Fighter.dx (last tick's raw x delta) so it
    // still reads as a walk cycle instead of the idle sway while it's happening.
    if(st==='IDLE')return Math.abs(f.dx)>0.3?{key:'walk',t01:(f.f%24)/24}:{key:'idle',t01:(f.f%60)/60};
    if(st==='DASH')return{key:'dash',t01:clamp(f.f/DASH_BACK.frames,0,1)};
    if(st==='BLOCK')return{key:'block',t01:clamp(f.f/10,0,1)};
    if(st==='BLOCKSTUN')return{key:'blockstun',t01:clamp(f.f/(f.stun||1),0,1)};

// --- Task 3.5 fix round 1: dynamic per-fight camera zoom cap ---
// Original test replaced the old fixed-1.28/heavyCharge-and-s3-only "tallest pose stays under the HUD
// at max zoom" check with one that measured the true worst case across every pose/keyframe *and* prop
// for a look (Rig.extent), used by G.startFight to compute a per-FIGHT zoom cap.
// --- Fix-wave item 4: per-frame cap, not per-fight ---
// A single fight-wide worst-case cap means one tall pose (Carl's own 'dash' lunge, a raised 'win'
// pose, Hobgoblin's held club) taxes the zoom for every OTHER frame of the fight too, not just the
// frames that pose is actually on screen for — see POSES.heavy's own Fix-wave item 4 comment for the
// concrete cost (a real overhead wind-up had to be trimmed to a barely-distinct forward lean just to
// keep an unrelated pairing's cap pinned). G.tick now computes capNow every frame from whichever
// pose(s) are actually on screen (Rig.topAt/G.topNow), so this test checks the SAME invariant the old
// one did (every pose's topmost point — joints, head circle, props — clears HUD_LINE at its own cap)
// but per-pose instead of per-fight: for every pose of every look in a representative pairing set, at
// THAT pose's own per-frame cap, screen y must clear HUD_LINE. This is provable in closed form (capNow
// is defined so the topmost point lands exactly at HUD_LINE, or above it once the 1.28 ceiling itself
// binds first) — its value here is as a correctness check on Rig.topAt's own folding, mirroring how
// the old test caught Rig.extent bugs. 'win'/'ko' are no longer excluded (see G.startFight's own
// comment): a per-frame cap means they're safe to include now, where the old per-fight cap had to
// look away from them to avoid taxing the whole fight for a pose only shown at RESULT.
Test.add('every pose of every look stays under the HUD at its own per-frame zoom cap',()=>{
  const pairs=[['carl','goblin'],['carl','hobgoblin'],['carl','grull'],['mongo','grull'],
    ['donut','mother_rat'],['mongo','mongo']];
  const seen=new Set();
  for(const[id1,id2]of pairs)for(const id of[id1,id2]){
    if(seen.has(id))continue;seen.add(id);
    const look=LOOKS[id],sc=(DEFS[id]&&DEFS[id].scale)||1;
    const table=look.rig==='quad'?POSES_QUAD:look.rig==='big'?POSES_BIG:POSES;
    for(const key in table){
      const kf=table[key];
      for(let i=0;i<kf.length-1;i++){
        const ta=kf[i].t,tb=kf[i+1].t;
        for(const t of[ta,(ta+tb)/2,tb]){
          const top=Rig.topAt(look,key,t,sc);
          const capNow=Math.min(1.28,(Camera.anchorY-HUD_LINE)/top);
          const screen=Camera.toScreen({x:0,zoom:capNow},0,FLOOR-top);
          ok(screen.sy>=HUD_LINE-1e-6,id+': '+key+'/t'+t.toFixed(2)+' topmost point at screen y='
            +screen.sy.toFixed(2)+', must clear the HUD (>='+HUD_LINE+') at its own per-frame cap ('
            +capNow.toFixed(3)+')')}}}}});
const CAP_EXCL={excludePoses:['win','ko']};
// Fix-wave item 3/4 sanity floor: even though the effective in-fight cap is now per-frame, the
// per-FIGHT upper bounds (G.zoomCap/G.cineZoomCap, computed via Rig.extent — see G.startFight) must
// still not collapse to something absurd for the tallest-vs-tallest stress pairings. 0.75, not 0.80:
// folding the drawn head into Rig.extent (item 3) raises Mongo's own worst-case top ('walk', head
// circle included) enough that Mongo×Mongo/Mongo×Grull both land at ~0.784, below the pre-head-fold
// floor of 0.80; 0.75 keeps real margin under the new number.
Test.add('per-fight cineZoomCap upper bound does not collapse past 0.75 for the tallest pairings',()=>{
  for(const[id1,id2]of[['mongo','grull'],['mongo','mongo'],['donut','mother_rat']]){
    const sc1=(DEFS[id1]&&DEFS[id1].scale)||1,sc2=(DEFS[id2]&&DEFS[id2].scale)||1;
    const ext1=Rig.extent(LOOKS[id1],sc1,CAP_EXCL),ext2=Rig.extent(LOOKS[id2],sc2,CAP_EXCL);
    const tallestTop=Math.max(ext1.top,ext2.top);
    const ratio=(Camera.anchorY-HUD_LINE)/tallestTop;
    const cineZoomCap=Math.min(1.28,ratio);
    ok(cineZoomCap>=0.75,id1+'x'+id2+' cineZoomCap '+cineZoomCap.toFixed(3)+' must not zoom out past 0.75')}});
// Pinning test, pre-item-4: for pairings well within budget, the per-fight upper bounds landed EXACTLY
// on the game's own un-clamped ceilings (1.12 gameplay / 1.28 cinematic) — meaningful back when those
// bounds WERE the effective in-fight cap, so any pose quietly dragging one below its natural ceiling
// (Carl's own 'heavy' wind-up before its rShoulder was trimmed; Hobgoblin's held club) was a real,
// player-visible bug.
// Fix-wave item 4: G.zoomCap/G.cineZoomCap are still computed the same way (min(1.12,ratio)/
// min(1.28,ratio) off Rig.extent's true worst case — unchanged API, see G.startFight's own comment)
// but are no longer what the camera actually renders against; that's now G.tick's per-frame capNow
// (Rig.topAt/G.topNow — see the 'own per-frame zoom cap' test above, which is what actually proves
// no pose crosses the HUD in real gameplay). Restoring POSES.heavy's real overhead angle and
// Hobgoblin's club to their natural length (both safe now that a tall pose only costs the frames it's
// on screen for, not the whole fight) pushes several pairings' per-fight UPPER BOUNDS below their old
// exact pins — expected and harmless, since those bounds are bookkeeping now, not a render-time
// constraint. This test is kept as a loose sanity check (still positive, still <= the hard ceiling)
// rather than an exact pin, since exact pinning is no longer a meaningful invariant post-item-4.
Test.add('per-fight zoomCap/cineZoomCap upper bounds stay positive and within their hard ceilings',()=>{
  const pairs=[['carl','goblin'],['carl','hobgoblin'],['carl','katia'],['donut','goblin']];
  for(const[id1,id2]of pairs){
    const sc1=(DEFS[id1]&&DEFS[id1].scale)||1,sc2=(DEFS[id2]&&DEFS[id2].scale)||1;
    const ext1=Rig.extent(LOOKS[id1],sc1,CAP_EXCL),ext2=Rig.extent(LOOKS[id2],sc2,CAP_EXCL);
    const tallestTop=Math.max(ext1.top,ext2.top);
    const ratio=(Camera.anchorY-HUD_LINE)/tallestTop;
    const zoomCap=Math.min(1.12,ratio),cineCap=Math.min(1.28,ratio);
    ok(zoomCap>0&&zoomCap<=1.12,id1+'x'+id2+' zoomCap '+zoomCap.toFixed(3)+' must be in (0,1.12]');
    ok(cineCap>0&&cineCap<=1.28,id1+'x'+id2+' cineZoomCap '+cineCap.toFixed(3)+' must be in (0,1.28]')}});
Test.add('every look\'s reach fits inside EDGE_PAD',()=>{
  // Rig.extent's reach includes prop geometry (a dagger/club/spikedclub's tip, horns, a tiara, cat
  // whiskers) on top of every joint's own FK, not just the shoulderW/armLen/limb formula this test
  // used before Task 3.5's fix round 1 — a look wearing a reach-extending prop could otherwise clear
  // this check while still poking a weapon tip past EDGE_PAD in a real screenshot. (Every look's own
  // pose data was retuned this fix round so this holds true-FK-wide, not just at the old formula's
  // idle-silhouette approximation — see LOOKS.mongo's Fix round 3 and POSES_BIG's per-key comments.)
  //
  // Fix-wave item 9: the donut/mother_rat quad-rig carve-out this test used to need is gone — both
  // were trimmed (LOOKS.donut/mother_rat's own comments) until their reach clears EDGE_PAD (bumped
  // 220->260 in item 3) with real margin, closing the gap the final review flagged (Important): at
  // 260px separation the old numbers put the rat's snout drawing through Carl's torso, visual and
  // hurtbox disagreeing by about a body length. Every look in the roster now passes the same check.
  for(const id in LOOKS){
    const look=LOOKS[id],sc=(DEFS[id]&&DEFS[id].scale)||1;
    const reach=Rig.extent(look,sc).reach;
    ok(reach<=EDGE_PAD,id+' reach '+reach.toFixed(1)+' must fit inside EDGE_PAD ('+EDGE_PAD+')')}});

Test.add('medium as a combo ender pushes the defender out of light range',()=>{
  // Chain 3 lights (light1/2/3 all have a non-null .chain) then, from light3's recovery, cancel
  // into a medium (script: light only through frame 23, medium from frame 24 on — the frame light3
  // enters recovery, verified against the fight's own frame counter, not guessed) so the ender
  // branch (att.moveName==='medium'&&att.combo>=3) is actually exercised, not just incidentally
  // satisfied by prior pushback. Capture the landing hit's attacker via a wrapped onEvent (Fight.emit
  // hands it the live Fighter, so a.moveName/a.combo reflect that exact hit) and diff its knockback
  // against a plain medium thrown from IDLE with combo 0. Both scenarios share identical dash/
  // separate() contamination on the hit-landing step (medium's approach dash runs through
  // f<=startup, which is also its first active frame, so the last dash increment and the hit
  // resolve in the same step), so the *difference* between the two deltas isolates the push
  // (90 vs MOVES.medium.push) exactly, independent of that shared collision noise.
  let capture=null;
  const f=mkFight({ctrl1:Ctrl.script([{f:0,until:23,intent:{light:true}},{f:24,until:60,intent:{medium:true}}]),
    onEvent:(type,a)=>{if(type==='hit'&&a.moveName==='medium'&&!capture)capture={moveName:a.moveName,combo:a.combo}}});
  f.p2.x=STAGE_W/2;closeIn(f); // room to be pushed; hitstop pauses Fight.frame for a few steps per landed hit, so budget generously
  let dx=0;
  for(let i=0;i<70&&dx===0;i++){const before=f.p2.x;f.step();const last=f.log[f.log.length-1];
    if(capture&&last&&last.type==='hit'&&last.f===f.frame&&last.who===1)dx=f.p2.x-before}
  ok(capture,'medium landed as the chain-cancel finisher');eq(capture.moveName,'medium');ok(capture.combo>=4,'combo at ender: '+capture.combo);
  const g=mkFight();closeIn(g);g.p1.combo=0;g.p1.startMove('medium');
  let dx2=0;
  for(let i=0;i<40&&dx2===0;i++){const before=g.p2.x;g.step();const last=g.log[g.log.length-1];
    if(last&&last.type==='hit'&&last.f===g.frame)dx2=g.p2.x-before}
  ok(dx2<60,'non-ender medium push stays well under 90, got '+dx2);
  eq(dx-dx2,90-MOVES.medium.push,'ender push (90) vs normal push ('+MOVES.medium.push+') differential; dx='+dx+' dx2='+dx2)});

Test.add('toast never overlaps the BLOCK/PUNCH button labels',()=>{
  // Fix round 3: round 2's centered-at-62%-of-canvas-width toast still ran its right edge over the
  // PUNCH label. Drives a worst-case (long, guaranteed-to-wrap) line through the real Audio.say ->
  // G.fitToastText path and checks the actual laid-out DOM rects, in canvas-local units (via the
  // same canvas.getBoundingClientRect() scale G.positionToast itself uses), against BLOCK/PUNCH.
  G.startFight();
  G.say('x'.repeat(120));
  const cr=canvas.getBoundingClientRect(),sx=W/cr.width,sy=H/cr.height;
  const toCanvas=r=>({x0:(r.left-cr.left)*sx,x1:(r.right-cr.left)*sx,y0:(r.top-cr.top)*sy,y1:(r.bottom-cr.top)*sy});
  const intersects=(a,b)=>a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0;
  // getBoundingClientRect() only covers the button circle itself, not its ::after data-label (a
  // generated pseudo-element, which has no standard geometry query) — the actual reported bug is the
  // label, which sits directly below the circle (top:100%, margin-top:4px, 10px text), so extend the
  // circle's rect down by 20 canvas-local px to cover it too.
  const withLabel=r=>({x0:r.x0,x1:r.x1,y0:r.y0,y1:r.y1+20});
  const t=toCanvas(document.getElementById('toast').getBoundingClientRect());
  const block=withLabel(toCanvas(document.getElementById('btnBlock').getBoundingClientRect()));
  const punch=withLabel(toCanvas(document.getElementById('btnPunch').getBoundingClientRect()));
  ok(!intersects(t,block),'toast rect '+JSON.stringify(t)+' must not intersect BLOCK+label '+JSON.stringify(block));
  ok(!intersects(t,punch),'toast rect '+JSON.stringify(t)+' must not intersect PUNCH+label '+JSON.stringify(punch));
  G.toTitle()});

// --- Task 3.6: batch tool ---
// Ctrl.competent has no rng of its own (see its comment in 30_input.js) — the same (fight,me,foe)
// state always yields the same intent for any seed. Two independently-built fights with the same
// seeds on both sides must therefore log bit-identically; this is what tests/batch.py's win-rate
// table depends on for reproducible seeds.
Test.add('Ctrl.competent is deterministic per seed',()=>{
  const mk=()=>mkFight({ctrl1:Ctrl.competent(7),ctrl2:AI.make('t3',9),clock:20});
  const f1=mk(),f2=mk();closeIn(f1);closeIn(f2);run(f1,900);run(f2,900);
  eq(JSON.stringify(f1.log),JSON.stringify(f2.log),'same matchup must reproduce the exact same fight log');
  ok(f1.log.length>0,'the fight actually did something')});
Test.add('Ctrl.competent blocks a foe\'s medium once its startup clock passes REACT frames',()=>{
  // Foe is walked into ATTACK by hand and given a short head start before p1's own controller ever
  // gets a decision — Fighter.tick's ATTACK case advances a move's phases regardless of the foe's own
  // future intents, so ctrl2 can go inert (Ctrl.idle()) from here. This sidesteps fix-wave item 8's
  // own proactive closing-distance medium (30_input.js): without a head start, p1's very first
  // decision (made from the pre-act snapshot, before foe's own script has run even once) would see
  // foe still IDLE and is guarded on foe.state!=='ATTACK', so it would try to close distance with its
  // own medium before the foe's is ever visible — a real simultaneous-decision limit, not a bug, but
  // not what this test means to isolate. Once foe.state is already ATTACK the closing guard
  // correctly holds off, exactly like the old "out of range, nothing else applies" idle case did.
  const f=mkFight({ctrl1:Ctrl.competent(1),ctrl2:Ctrl.idle()});
  f.p2.act(Object.assign(Ctrl.EMPTY(),{medium:true}));
  for(let i=0;i<4;i++)f.p2.tick();
  run(f,3);
  eq(f.p1.state,'BLOCK','p1 should be guarding once foe\'s medium startup clock passes REACT frames')});
Test.add('Ctrl.competent chains lights once in range and idle',()=>{
  const f=mkFight({ctrl1:Ctrl.competent(2)});closeIn(f);run(f,20);
  ok(f.log.some(e=>e.type==='hit'&&e.who===1),'p1 landed at least one light from range')});
// Fix-wave item 8: the competent bot used to just stand there outside light range forever if nothing
// else applied — which is why intercept/medium-punish never fired in the run that certified the AI
// tiers (final review, Important). It now closes with a medium (its own startup dash covers ground)
// whenever it's out of range and the foe isn't already attacking.
Test.add('Ctrl.competent closes distance with a medium when out of range and the foe isn\'t attacking',()=>{
  const f=mkFight({ctrl1:Ctrl.competent(3),ctrl2:Ctrl.idle()}); // default spacing: out of light range
  run(f,1);
  eq(f.p1.state,'ATTACK');eq(f.p1.moveName,'medium')});
// Fix-wave item 8: every 5th time the foe enters blockstun (a mix-up, not spam — counted on the
// rising edge of BLOCKSTUN so one long blockstun window only counts once), the bot arms a heavy
// instead of continuing its normal offense.
Test.add('Ctrl.competent mixes in a heavy on the 5th distinct blockstun opening',()=>{
  const ctrl=Ctrl.competent(4),f=mkFight({ctrl1:ctrl});closeIn(f);
  const me=f.p1,foe=f.p2;let heavyFires=0;
  for(let opening=1;opening<=5;opening++){
    foe.setState('BLOCKSTUN',0);foe.stun=1;
    const it=ctrl.next(f,me,foe);
    if(opening<5)ok(!it.heavy,'opening '+opening+' must not arm a heavy yet');
    else{ok(it.heavy,'the 5th opening must arm a heavy');heavyFires++}
    foe.setState('IDLE',0);
    ctrl.next(f,me,foe)} // a real call while foe reads IDLE — the rising-edge reset the controller
                          // itself needs to see before the next opening counts as a NEW one
  eq(heavyFires,1)});

// Fix-wave item 1 (Critical): e.ts defaulted to 0 and was only ever advanced by regen*360000, never
// anchored to Energy.now() -- so now-ts was always ~57 real years and every tick() refilled to max
// instantly, making the energy gate inert. Fix: Energy.spend anchors e.ts=Energy.now() the instant
// it spends FROM full (the transition out of "already regenerated"); Energy.tick() re-anchors
// e.ts=Energy.now() whenever e.n is already at/over max (both the "never spent" and "just regenerated
// back to max" cases). Regen math itself (floor((now-ts)/360000)) is unchanged.
Test.add('Energy regenerates against the wall clock (fix-wave item 1): spend anchors ts, tick regens at 5/12/60 minutes',()=>{
  const origNow=Energy.now;
  try{
    let t=1000000;Energy.now=()=>t;
    Save.data=Meta.defaults(); // energy.n=10 (full), ts=0 -- must not matter once a real spend anchors it
    ok(Energy.spend(3),'spend from full must succeed');
    eq(Save.data.energy.n,7);
    eq(Save.data.energy.ts,t,'spending from full must anchor ts to now, not leave it at the stale default');
    t+=5*60*1000; // T+5min since the spend
    Energy.tick();
    eq(Save.data.energy.n,7,'no regen yet -- under the 6-minute interval');
    t=1000000+12*60*1000; // T+12min since the spend
    Energy.tick();
    eq(Save.data.energy.n,9,'2 full 6-minute intervals since the spend => +2');
    t=1000000+60*60*1000; // T+60min since the spend
    Energy.tick();
    eq(Save.data.energy.n,10,'caps at max');
    eq(Save.data.energy.ts,t,'ts is pinned to now once full, so a later real spend anchors correctly again')
  }finally{Energy.now=origNow}});

// Task 4.2: Crystals (pity, shards) -----------------------------------------------------------
// Raw tier distribution off Crystal.KINDS.basic.odds via the pure Crystal.rollTier helper — a
// fresh RNG(seed) per draw, seeds 1..10000, pity intentionally NOT in this loop (rollTier doesn't
// touch it) so this measures the odds table itself, not the pity-adjusted long-run distribution
// (pity deliberately skews frequencies over many real opens — that's tested on its own below, not
// here — forcing ~1/10 of opens up a tier moves 1-star/2-star share by ~7 points over 10k opens,
// which would blow well past a 2% tolerance if this test ran through Crystal.open unbroken).
Test.add('Crystal.rollTier matches basic odds within 2% over 10000 draws',()=>{
  const tally={1:0,2:0,3:0};
  for(let s=1;s<=10000;s++){const t=Crystal.rollTier(Crystal.KINDS.basic.odds,Crystal.rng(s));tally[t]++}
  ok(Math.abs(tally[1]/10000-.70)<=.02,'1-star freq '+tally[1]/10000);
  ok(Math.abs(tally[2]/10000-.25)<=.02,'2-star freq '+tally[2]/10000);
  ok(Math.abs(tally[3]/10000-.05)<=.02,'3-star freq '+tally[3]/10000)});
Test.add('Crystal.rollTier matches premium odds within 2% over 10000 draws',()=>{
  const tally={2:0,3:0,4:0};
  for(let s=1;s<=10000;s++){const t=Crystal.rollTier(Crystal.KINDS.premium.odds,Crystal.rng(s));tally[t]++}
  ok(Math.abs(tally[2]/10000-.60)<=.02,'2-star freq '+tally[2]/10000);
  ok(Math.abs(tally[3]/10000-.32)<=.02,'3-star freq '+tally[3]/10000);
  ok(Math.abs(tally[4]/10000-.08)<=.02,'4-star freq '+tally[4]/10000)});
// Pity is a pure counter, decoupled from what the previous nine rolls actually were — driving it
// with nine real 1-star rolls first would just be a slower way to reach the same counter value, so
// these set Save.data.pity[kind] to 9 directly (as the 4.2/4.3 brief's own "simpler" alternative
// puts it) and check the guaranteed floor holds across many seeds, independent of the natural roll.
// roster:{} (no champ owned yet) so every pull in these two is a new-champion pull whose returned
// `stars` is exactly the (pity-adjusted) roll — a dup pull's `stars` reflects the roster entry's
// existing star count instead, which pity never touches, so leaving carl pre-owned here would
// decouple what's asserted from what pity actually guarantees.

    const r=Crystal.open('basic');
    ok(r,'open must succeed, seed '+seed);
    ok(r.stars>=2,'seed '+seed+' got '+r.stars+'-star, expected >=2')}});

// this.lastFightOpts verbatim, which for arena still carried the ALREADY-RESOLVED Arena.start()
// object (enemy/tier/hpMul) from the fight that just ended -- so a win at streak 0 re-fought the
// exact same (now stale) opponent while still banking the streak, unlimited farming of the easiest
// arena matchup with one button. Fix: the 'again' handler now routes through G.startArena() when
// G.mode==='arena' (which draws a fresh Arena.start() for the NEW streak) instead of startFight
// with the stale encounter object.
Test.add('Arena FIGHT AGAIN draws a fresh Arena.start() encounter for the post-win streak, not the stale resolved one (fix-wave item 2)',()=>{
  Save.data=Meta.defaults();Save.data.arena={best:0,streak:0};
  G.startArena({ctrl1:Ctrl.script([L(0)]),seed:1}); // streak 0 -> goblin/t1/hpMul 1.00

  closeIn(G.fight);G.fight.p2.hp=1;G.sim=true;
  for(let i=0;i<400;i++)G.tick();
  eq(G.state,'RESULT');
  eq(Save.data.arena.streak,1,'the win must have banked the streak to 1 first');
  document.getElementById('again').click();
  eq(G.mode,'arena','FIGHT AGAIN must still be an arena fight');
  const expect=Arena.start(); // pure query off the now-current streak (1) -- goblin/t1 no longer,
  // per the Arena.start() sequence test: streak 1 -> skeleton/t1/hpMul 1.08
  eq(G.fight.p2.def.id,expect.enemy.id,'the new fight must use the CURRENT streak\'s encounter');
  eq(G.encounter.tier,expect.tier);
  ok(Math.abs(G.encounter.hpMul-expect.hpMul)<1e-9);
  ok(G.fight.p2.def.id!==staleEnemyId,'must not be the same stale enemy the fight just beat');
  ok(G.fight.p2.maxHp!==staleHp||G.fight.p2.def.id!==staleEnemyId,'must not be the stale resolved encounter object');

  ok(document.getElementById('revealText_basic').textContent.length>0,'revealed at frame 40');
  G.simFrames(20); // ticks past 40 must not keep advancing the counter
  eq(Screens._reveal.frame,40);
  Screens.title();G.sim=false});
Test.add('shop BASIC CRYSTAL opens a crystal immediately on buy (ruling: buy == Crystal.open + reveal): deducts 500 gold and mutates the roster',()=>{

  eq(Screens._current,'crystal','buying navigates to the crystal screen to show the reveal');

Test.add('the arena screen\'s FIGHT button starts G.startArena with arena as the fight\'s origin, and QUIT/CONTINUE return to it',()=>{
  Save.data=Meta.defaults();
  Screens.arena();
  document.getElementById('arenaFight').click(); // Ctrl.player() p1: proves mode+origin wiring only
  eq(G.mode,'arena');eq(Screens._origin.name,'arena');
  G.toTitle(); // re-fight with a scripted p1 so this one actually reaches RESULT within the tick
  // budget below; Screens._origin is left exactly as the click above set it (toTitle doesn't touch it).
  G.startArena({ctrl1:Ctrl.script([L(0)]),seed:1});
  closeIn(G.fight);G.fight.p2.hp=1;G.sim=true;
  for(let i=0;i<400;i++)G.tick();
  eq(G.state,'RESULT');
  G.backToOrigin();
  eq(Screens._current,'arena');
  G.toTitle();G.sim=false});
Test.add('FIGHT AGAIN is hidden after a quest win (the node is now done; replaying it would just refuse) and shown after other outcomes',()=>{
  Save.data=Meta.defaults();
  G.startFight({floor:1,node:0,ctrl1:Ctrl.script([L(0)]),ctrl2:Ctrl.idle(),seed:1});
  closeIn(G.fight);G.fight.p2.hp=1;G.sim=true;
  for(let i=0;i<400;i++)G.tick();
  eq(G.state,'RESULT');
  eq(document.getElementById('again').style.display,'none','hidden after a quest win');
  G.toTitle();G.sim=false;
  Save.data=Meta.defaults();
  G.startArena({ctrl1:Ctrl.script([L(0)]),seed:1});
  closeIn(G.fight);G.fight.p2.hp=1;G.sim=true;
  for(let i=0;i<400;i++)G.tick();
  eq(G.state,'RESULT');
  ok(document.getElementById('again').style.display!=='none','shown after an arena win');
  G.toTitle();G.sim=false});

Test.add('starting a fight from any browsing screen hides that screen (it must not linger over the fight)',()=>{
  Save.data=Meta.defaults();
  for(const show of[()=>Screens.map(1),()=>Screens.roster(),()=>Screens.crystal(),()=>Screens.shop(),()=>Screens.arena()]){
    show();
    const shown=Screens._current;
    ok(document.getElementById(shown).classList.contains('show'),shown+' must be visible before the fight starts');
    G.startFight({p2:'donut'});
    ok(!document.getElementById(shown).classList.contains('show'),shown+' must be hidden once G.startFight begins');
    G.toTitle()}});
