<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Carl's Doorway Brawl</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#090b12;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;background:#101422}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(9,11,18,.85)}.overlay.show{display:flex}
.panel{text-align:center;padding:16px;max-width:520px}.panel h1{margin:0 0 8px;font-size:28px;letter-spacing:2px}.panel p{font-size:13px;line-height:1.5}.panel button{display:block;width:100%;margin:8px 0;padding:12px;font:inherit;font-size:16px;background:#f4c542;color:#111;border:0;border-radius:6px}
#btns{display:none}#btns.show{display:block}
.cbtn{position:absolute;width:76px;height:76px;border-radius:50%;border:3px solid #f4c542;background:rgba(26,31,51,.8);color:#f4c542;font:inherit;font-size:26px;display:flex;align-items:center;justify-content:center;line-height:1}
.cbtn::after{content:attr(data-label);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:10px;letter-spacing:1px;color:#f4c542;white-space:nowrap}
.cbtn.ready{background:#f4c542;color:#111;box-shadow:0 0 16px 4px rgba(244,197,66,.65)}
#btnBlock{left:22px;bottom:40px}
#btnPower{right:22px;bottom:40px}
#btnKick{right:110px;bottom:40px}
#btnPunch{right:198px;bottom:40px}
#powerPicker{position:absolute;right:14px;bottom:128px;display:none;gap:10px}
#powerPicker.show{display:flex}
#powerPicker button{width:52px;height:52px;border-radius:50%;border:2px solid #f4c542;background:#1a1f33;color:#f4c542;font:inherit;font-size:13px;font-weight:bold}
#powerPicker button:disabled{opacity:.3}
/* Positioned in JS (G.positionToast, called from G.fit on load/resize) off canvas.getBoundingClientRect()
   so it tracks the canvas box exactly (not #wrap, which can letterbox at other aspect ratios); left/top/
   max-width are set inline per call. */
#toast{position:fixed;transform:translateX(-50%);font-size:13px;line-height:1.2;color:#f4c542;pointer-events:none;text-align:center;white-space:normal;background:rgba(10,11,18,.6);border-radius:10px;padding:4px 12px}
#toast:empty{padding:0}
#toast.hidden{visibility:hidden}
/* Task 4.5: meta screens (title/map/roster/crystal/shop/arena). .panel (above) stays the narrow
   three-button style for title/pauseMenu/result; .scr is the wide format every new browsing screen
   uses so it can hold cards/paths/tabs at 854x480 without scrolling. */
#titleLogo{font-size:26px;letter-spacing:1px;transform:scaleX(.88);transform-origin:center;font-weight:900;line-height:1.15}
.sub{font-size:11px;color:#999;margin:0 0 10px}
.scr{box-sizing:border-box;text-align:center;padding:10px 14px;width:820px;max-width:96vw;max-height:456px;overflow:hidden;display:flex;flex-direction:column}
.scr h2{margin:0 0 8px;font-size:17px;letter-spacing:3px;color:#f4c542;text-transform:uppercase;transform:scaleX(.92)}
.backbtn{margin-top:14px;width:180px;min-height:44px;align-self:center;padding:10px;font-size:13px;letter-spacing:1px;background:#1a1f33;color:#f4c542;border:2px solid #f4c542;border-radius:6px;flex:none}
.curstrip{display:flex;gap:14px;justify-content:center;font-size:12px;color:#f4c542;margin:0 0 10px;flex-wrap:wrap}
.ftabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.ftab{min-height:44px;padding:6px 16px;font-size:12px;letter-spacing:1px;background:#1a1f33;color:#999;border:1px solid #444;border-radius:4px}
.ftab.active{color:#f4c542;border-color:#f4c542}
.path{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;overflow:hidden;flex:1;justify-content:center}
.node{width:320px;max-width:84%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;letter-spacing:2px;border-radius:6px;border:2px solid #3a3a3a;background:#181c2b;color:#666}
.node.open{border-color:#f4c542;color:#f4c542;background:#20263d}
.node.done{border-color:#5c8a4a;color:#8fd18a;background:#182018}
.node.boss{font-weight:bold}
.node.locked::before{content:'\1F512';margin-right:2px}
.node.boss::before{content:'\1F451';margin-right:2px}
.energy{display:flex;gap:4px;justify-content:center;margin:6px 0}
.pip{width:14px;height:14px;border-radius:3px;background:#2a2a2a;border:1px solid #555}
.pip.full{background:#f4c542;border-color:#f4c542}
/* Fix round 1: cards are a single-column, full-width row (portrait | info | action row) instead of
   a 2-column grid of tall cards -- a 2-column layout could only fit 3 stacked action buttons at
   26px each; a single wide row fits the same 3 actions SIDE BY SIDE at a real 44px+ touch height,
   and still stacks up to 4 champions (carl/katia/donut/mongo) at 854x480 with no scroll. */
.cards{display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1;justify-content:flex-start}
.card{box-sizing:border-box;background:#181c2b;border:2px solid #333;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:left}
.card.active{border-color:#f4c542}
.card canvas{width:52px;height:52px;flex:none;background:#101422;border-radius:4px}
.card .info{flex:1 1 auto;min-width:0}
.card .name{font-size:12px;color:#fff;font-weight:bold;letter-spacing:1px}
.card .stars{color:#f4c542;font-size:11px;margin-left:6px}
.card .rankline{display:flex;align-items:center;gap:8px;margin:3px 0}
.card .pips{display:flex;gap:2px}
.card .rp{display:inline-block;width:7px;height:7px;border-radius:50%;background:#333;border:1px solid #555}
.card .rp.on{background:#7fb0a8;border-color:#7fb0a8}
.card .lvl{font-size:10px;color:#bbb}
.card .xpbar{height:5px;background:#333;border-radius:3px;overflow:hidden;max-width:240px}
.card .xpbar i{display:block;height:100%;background:#f4c542}
.card .actions{flex:0 0 auto;display:flex;gap:6px}
.card .actions button{min-width:96px;min-height:44px;padding:4px 6px;font-size:9px;line-height:1.3;letter-spacing:.3px;border-radius:4px;background:#1a1f33;color:#f4c542;border:1px solid #f4c542;font-family:inherit}
.card .actions button:disabled{opacity:.3}
.card .actions button.select{background:#f4c542;color:#111}
.kcards{display:flex;gap:10px;justify-content:center;flex:1;align-items:flex-start;flex-wrap:wrap;overflow:hidden}
.kcard{box-sizing:border-box;width:220px;background:#181c2b;border:2px solid #444;border-radius:8px;padding:10px}
.kcard h3{margin:0 0 4px;font-size:12px;color:#f4c542;letter-spacing:1px}
.kcard .cost{font-size:11px;color:#ccc;margin-bottom:6px}
.kcard canvas{background:#101422;border-radius:6px;margin:4px 0;display:block}
.kcard .rtext{font-size:10px;color:#f4c542;min-height:24px}
.kcard button{width:100%;min-height:44px;padding:10px;font-size:12px;letter-spacing:1px;border-radius:6px;background:#f4c542;color:#111;border:0;font-family:inherit}
.kcard button:disabled{opacity:.35;background:#555;color:#999}
.arenabox{text-align:center;margin:auto 0}
.arenabox .streak{font-size:26px;color:#f4c542;font-weight:bold}
.arenabox .best{font-size:12px;color:#999;margin-bottom:10px}
.enemyprev{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.enemyprev canvas{background:#101422;border-radius:6px}
#arenaFight{min-height:48px;width:220px;padding:12px;font-size:15px;letter-spacing:2px;background:#f4c542;color:#111;border:0;border-radius:6px;font-family:inherit}
</style></head><body><div id="wrap"><canvas id="game" width="854" height="480"></canvas>
<div id="btns">
<button id="btnBlock" class="cbtn" data-label="BLOCK"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5 19.5 5.5V11C19.5 16 16 20 12 21.5 8 20 4.5 16 4.5 11V5.5Z"/></svg></button>
<button id="btnPunch" class="cbtn" data-label="PUNCH"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><rect x="7" y="9" width="12" height="10" rx="3"/><circle cx="9.5" cy="7" r="2.3"/><circle cx="13" cy="6" r="2.3"/><circle cx="16.5" cy="7" r="2.3"/><rect x="4" y="11" width="5" height="6" rx="2.4"/></svg></button>
<button id="btnKick" class="cbtn" data-label="KICK"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M9 2h5v10.5l5.2 2.3c1 .45 1.8 1.4 1.8 2.6V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4.2C4 11.3 6.2 9.4 9 9.4z"/></svg></button>
<button id="btnPower" class="cbtn" data-label="POWER"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M13 1 3 14h6.5L8.5 23 21 9h-7z"/></svg></button>
<div id="powerPicker"><button id="pk1">S1</button><button id="pk2">S2</button><button id="pk3">S3</button></div>
</div>
<div id="toast"></div>
<div class="overlay show" id="title"><div class="panel">
<h1 id="titleLogo">CARL'S DOORWAY<br>BRAWL</h1>
<p class="sub">ONE THUMB. ONE DOORWAY. ONE CRAWLER LEAVES.</p>
<button id="btnCampaign">CAMPAIGN</button>
<button id="btnArenaMenu">ARENA</button>
<button id="btnRoster">ROSTER</button>
<button id="btnKiosk">KIOSK</button>
<button id="btnExhibition">EXHIBITION</button>
<button id="titleMute">SOUND: ON</button>
</div></div>
<div class="overlay" id="pauseMenu"><div class="panel"><h1>PAUSED</h1><button id="resume">RESUME</button><button id="quit">QUIT</button></div></div>
<div class="overlay" id="result"><div class="panel"><h1 id="resultTitle">VICTORY</h1><p id="resultLine"></p><button id="again">FIGHT AGAIN</button><button id="resultTitleBtn">CONTINUE</button></div></div>
<div class="overlay" id="map"><div class="scr">
<h2>CAMPAIGN</h2>
<div class="ftabs" id="mapTabs"></div>
<div class="energy" id="mapEnergy"></div>
<div class="path" id="mapPath"></div>
<button class="backbtn" id="mapBack">BACK</button>
</div></div>
<div class="overlay" id="roster"><div class="scr">
<h2>ROSTER</h2>
<div class="cards" id="rosterCards"></div>
<button class="backbtn" id="rosterBack">BACK</button>
</div></div>
<div class="overlay" id="crystal"><div class="scr">
<h2>CRYSTALS</h2>
<div class="kcards" id="crystalCards"></div>
<button class="backbtn" id="crystalBack">BACK</button>
</div></div>
<div class="overlay" id="shop"><div class="scr">
<h2>SPONSOR PERK KIOSK</h2>
<div class="curstrip" id="shopCurrency"></div>
<div class="kcards" id="shopCards"></div>
<button class="backbtn" id="shopBack">BACK</button>
</div></div>
<div class="overlay" id="arena"><div class="scr">
<h2>ARENA</h2>
<div class="arenabox">
<div class="streak" id="arenaStreak">STREAK 0</div>
<div class="best" id="arenaBest">BEST 0</div>
<div class="enemyprev" id="arenaEnemy"></div>
<button id="arenaFight">FIGHT</button>
</div>
<button class="backbtn" id="arenaBack">BACK</button>
</div></div>
</div><script>
